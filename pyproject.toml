[build-system]
requires = ["setuptools>=61","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markovq"
version = "0.1.0.dev0"
description = "Classical and quantum stochastic dynamics"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23","scipy>=1.9"]
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools]
packages = ["markovq"]

[tool.setuptools.package-data]
markovq = ["py.typed"]
