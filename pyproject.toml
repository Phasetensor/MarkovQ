[build-system]
requires = ["setuptools>=61","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markovq"
version = "0.1.0"
description = "Classical and quantum stochastic dynamics"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23","scipy>=1.9"]
readme = "README.md"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/Phasetensor/MarkovQ"
Issues = "https://github.com/Phasetensor/MarkovQ/issues"

[project.optional-dependencies]
interop = ["calibmap==0.1.0", "shotweave==0.2.0", "bornlens==0.3.1", "qiskit>=1"]
references = ["qiskit>=1", "qutip>=5"]

[tool.setuptools]
packages = ["markovq", "markovq.quantum"]

[tool.setuptools.package-data]
markovq = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C4"]
