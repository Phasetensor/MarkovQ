name: Publish approved MarkovQ artifacts
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
concurrency: release-markovq-010
permissions: {}
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: |
          python -c 'import tomllib; assert tomllib.load(open("pyproject.toml","rb"))["project"]["version"]=="0.1.0"'
          python -m build
          python -m twine check --strict dist/*
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          if git rev-parse --verify --quiet refs/tags/v0.1.0; then
            test "$(git rev-list -n1 v0.1.0)" = "$GITHUB_SHA"
          else
            git tag v0.1.0 "$GITHUB_SHA"
            git push origin refs/tags/v0.1.0
          fi
  publish:
    needs: tag
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: approved
      - run: |
          cd approved
          sha256sum -c SHA256SUMS
          mkdir ../dist
          cp *.whl *.tar.gz ../dist/
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: approved
      - run: |
          cd approved
          sha256sum -c SHA256SUMS
          gh release create v0.1.0 *.whl *.tar.gz SHA256SUMS --verify-tag --notes-file ../docs/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify public files and installation
        run: |
          python -m venv /tmp/mq-public
          /tmp/mq-public/bin/pip install --index-url https://pypi.org/simple markovq==0.1.0
          cd /tmp
          /tmp/mq-public/bin/python -c 'from importlib.metadata import version; from markovq import line_walk; assert version("markovq")=="0.1.0" and line_walk(3).n==3'
          python - <<'PYTHON'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "approved"
          with urllib.request.urlopen("https://pypi.org/pypi/markovq/0.1.0/json") as response:
              files = json.load(response)["urls"]
          assert {f["filename"] for f in files} == {p.name for p in root.glob("*.whl")} | {p.name for p in root.glob("*.tar.gz")}
          for f in files:
              name = f["filename"]
              digest = hashlib.sha256((root/name).read_bytes()).hexdigest()
              for url in [f["url"], "https://github.com/Phasetensor/MarkovQ/releases/download/v0.1.0/"+name]:
                  with urllib.request.urlopen(url) as stream:
                      assert hashlib.sha256(stream.read()).hexdigest() == digest == f["digests"]["sha256"]
              print(name, digest)
          PYTHON
