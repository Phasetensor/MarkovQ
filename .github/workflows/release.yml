name: Publish approved MarkovQ artifacts
on:
  push:
    tags: ['v0.1.0']
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: |
          python -c 'import os,tomllib; assert "v"+tomllib.load(open("pyproject.toml","rb"))["project"]["version"]==os.environ["GITHUB_REF_NAME"]'
          python -m build
          python -m twine check --strict dist/*
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: approved
      - run: |
          cd approved
          sha256sum -c SHA256SUMS
          mkdir ../dist
          cp *.whl *.tar.gz ../dist/
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: approved
      - run: |
          cd approved
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.whl *.tar.gz SHA256SUMS --verify-tag --notes-file ../docs/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
